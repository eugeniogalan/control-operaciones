{% for l in logs %}<div style="border-top:1px solid #eee;padding:6px 0;font-size:13px"><b>{{l.accion}}</b> · {{l.usuario}}{% if l.detalle %} — {{l.detalle}}{% endif %}<div class="muted" style="font-size:12px">{{l.fecha|replace('T',' ')}} (hora CDMX) · por {{l.actor}}</div></div>{% else %}<p class="muted">Sin movimientos.</p>{% endfor %}
