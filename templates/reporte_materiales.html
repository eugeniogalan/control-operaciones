{% extends 'base.html' %}{% block body %}<h1>Consumo de materiales</h1>
<form class="card filt"><label>Desde<input type="date" name="desde" value="{{desde}}"></label><label>Hasta<input type="date" name="hasta" value="{{hasta}}"></label><div><button class="btn">Ver</button> <button type="button" class="btn sec" onclick="print()">🖨 Imprimir</button></div></form>
<div class="tw"><table><tr><th>Sección</th><th>Concepto</th><th>Tipo</th><th>Total</th><th>Unidad</th><th>Órdenes</th></tr>{% for r in rows %}<tr><td class="muted">{{r.seccion}}</td><td>{{r.concepto}}</td><td>{{r.tipo}}</td><td><b>{{r.total|round(1)}}</b></td><td>{{r.unidad}}</td><td>{{r.ordenes}}</td></tr>{% else %}<tr><td colspan="6" class="muted">Sin consumos en el periodo.</td></tr>{% endfor %}</table></div>{% endblock %}
