services:
  - type: web
    name: ops-app
    runtime: python
    plan: starter   # plan de pago: necesario para el disco persistente
    buildCommand: pip install -r requirements.txt
    # seed.py solo siembra datos de EJEMPLO si la base no existe o está vacía; nunca sobrescribe datos reales.
    startCommand: python seed.py --if-missing && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_DIR          # base (ops.db) y archivos (uploads/) en el disco persistente
        value: /var/data
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_USERS_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
